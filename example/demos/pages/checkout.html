<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pago</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.5 system-ui, sans-serif; background: #eef1f4; color: #14171c; }
  main { display: grid; grid-template-columns: 1fr 360px; gap: 24px; max-width: 1060px; margin: 72px auto; align-items: start; }
  #form { min-height: 520px; display: flex; flex-direction: column; }
  .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 10px 40px rgba(20,30,50,.06); }
  h1 { font-size: 22px; margin: 0 0 20px; }
  .plans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
  .plan { border: 1.5px solid #dfe3e8; border-radius: 12px; padding: 14px; cursor: pointer; transition: border-color .2s, background .2s; }
  .plan b { display: block; } .plan span { color: #6b7380; font-size: 14px; }
  .plan[aria-checked=true] { border-color: #0f766e; background: #f0fbf8; }
  label { display: block; font-size: 13px; color: #6b7380; margin: 14px 0 6px; }
  input { width: 100%; font: inherit; padding: 11px 12px; border: 1px solid #d6dbe1; border-radius: 10px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pay { width: 100%; margin-top: 22px; font: 600 15px system-ui; padding: 13px; border: 0; border-radius: 11px; background: #0f766e; color: #fff; cursor: pointer; }
  .sum div { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #eef0f3; }
  .sum div:first-of-type { border-top: 0; }
  .sum .total { font-weight: 700; font-size: 18px; }
  .ok { display: none; text-align: center; margin: auto; }
  .ok.on { display: block; animation: in .4s ease-out; }
  .ok .tick { width: 56px; height: 56px; border-radius: 50%; background: #0f766e; color: #fff; display: grid; place-items: center; font-size: 28px; margin: 0 auto 12px; }
  @keyframes in { from { opacity: 0; transform: scale(.96); } }
</style>
</head>
<body>
<main>
  <div class="card" id="form">
    <h1>Únete al Escuadrón Rojo</h1>
    <div class="plans">
      <div class="plan" data-testid="monthly" aria-checked="true"><b>Mensual</b><span>24 cr / piloto</span></div>
      <div class="plan" data-testid="yearly" aria-checked="false"><b>Anual</b><span>19 cr / piloto · ahorra 20%</span></div>
    </div>
    <label for="card">Número de tarjeta</label>
    <input id="card" data-testid="card" placeholder="1234 1234 1234 1234">
    <div class="row">
      <div><label>Vencimiento</label><input data-testid="exp" placeholder="MM / AA"></div>
      <div><label>CVC</label><input data-testid="cvc" placeholder="123"></div>
    </div>
    <button class="pay" data-testid="pay">Pagar 288 cr</button>
    <div class="ok" id="ok"><div class="tick">✓</div><b>Ya vuelas con el Escuadrón Rojo</b><br><span style="color:#6b7380">Recibo enviado a leia@alianza.reb</span></div>
  </div>
  <div class="card sum">
    <h1>Resumen</h1>
    <div><span>Escuadrón Rojo, 12 pilotos</span><span id="line">288 cr / mes</span></div>
    <div><span>Impuesto imperial</span><span>0 cr</span></div>
    <div class="total"><span>Total hoy</span><span id="total">288 cr</span></div>
  </div>
</main>
<script>
  const plans = document.querySelectorAll(".plan");
  plans.forEach((p) => p.onclick = () => {
    plans.forEach((o) => o.setAttribute("aria-checked", o === p));
    const yearly = p.dataset.testid === "yearly";
    document.getElementById("line").textContent = yearly ? "2.736 cr / año" : "288 cr / mes";
    document.getElementById("total").textContent = yearly ? "2.736 cr" : "288 cr";
    document.querySelector(".pay").textContent = yearly ? "Pagar 2.736 cr" : "Pagar 288 cr";
  });
  document.querySelector(".pay").onclick = () => {
    document.querySelectorAll("#form > :not(#ok)").forEach((el) => el.style.display = "none");
    document.getElementById("ok").classList.add("on");
  };
</script>
</body>
</html>
