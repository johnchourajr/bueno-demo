<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reclutamiento</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, sans-serif; background: #0f1115; color: #e8e6e1; }
  main { max-width: 1060px; margin: 0 auto; padding: 44px 40px; }
  .top { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .top h1 { margin: 0; font-size: 22px; flex: 1; }
  .tabs { display: flex; gap: 4px; background: #1a1d24; border-radius: 9px; padding: 3px; }
  .tabs button { font: inherit; color: #9aa0ab; background: none; border: 0; padding: 6px 12px; border-radius: 7px; cursor: pointer; }
  .tabs button[aria-pressed=true] { background: #2a2f3a; color: #fff; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 18px; }
  .stat { background: #171a20; border: 1px solid #23272f; border-radius: 12px; padding: 18px; }
  .stat small { color: #8a909b; } .stat b { display: block; font-size: 28px; margin-top: 4px; transition: opacity .25s; }
  .up { color: #4ade80; font-size: 13px; }
  .chart { position: relative; background: #171a20; border: 1px solid #23272f; border-radius: 12px; padding: 24px 24px 16px; }
  .bars { display: flex; align-items: end; gap: 10px; height: 300px; }
  .bar { flex: 1; background: linear-gradient(#7c8cff, #5465e8); border-radius: 6px 6px 2px 2px; transition: height .5s cubic-bezier(.2,.8,.2,1), filter .2s; position: relative; }
  .bar:hover { filter: brightness(1.25); }
  .tip { position: absolute; bottom: calc(100% + 10px); left: 50%; transform: translateX(-50%); white-space: nowrap; background: #fff; color: #111; font-size: 13px; padding: 6px 10px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .bar:hover .tip { opacity: 1; }
  .axis { display: flex; gap: 10px; margin-top: 8px; color: #6b717c; font-size: 12px; }
  .axis span { flex: 1; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Reclutamiento</h1>
    <div class="tabs">
      <button data-testid="r7" aria-pressed="true">7d</button>
      <button data-testid="r30" aria-pressed="false">30d</button>
      <button data-testid="r90" aria-pressed="false">90d</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><small>Midiclorianos</small><b id="s1">18.420</b><span class="up">+12,4 %</span></div>
    <div class="stat"><small>Nuevos reclutas</small><b id="s2">142</b><span class="up">+8,1 %</span></div>
    <div class="stat"><small>Bajas al Lado Oscuro</small><b id="s3">1,9 %</b><span class="up">−0,3 pts</span></div>
  </div>
  <div class="chart">
    <div class="bars" id="bars"></div>
    <div class="axis" id="axis"></div>
  </div>
</main>
<script>
  const sets = {
    "7d": { labels: ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"], v: [42,55,48,71,66,38,44], stats: ["18.420","142","1,9 %"] },
    "30d": { labels: ["S1","S2","S3","S4","S5","S6","S7"], v: [52,61,58,80,92,74,88], stats: ["76.910","611","2,1 %"] },
    "90d": { labels: ["Jul","Ago","Sep","Oct","Nov","Dic","Ene"], v: [40,48,63,70,77,95,84], stats: ["221.300","1.804","2,4 %"] },
  };
  const bars = document.getElementById("bars");
  for (let i = 0; i < 7; i++) {
    const b = document.createElement("div");
    b.className = "bar";
    b.dataset.testid = `bar-${i}`;
    b.innerHTML = '<span class="tip"></span>';
    bars.appendChild(b);
  }
  function show(key) {
    const s = sets[key];
    [...bars.children].forEach((b, i) => {
      b.style.height = `${s.v[i]}%`;
      b.querySelector(".tip").textContent = `${s.labels[i]} · ${(s.v[i] * 312).toLocaleString("de")} midiclorianos`;
    });
    document.getElementById("axis").innerHTML = s.labels.map((l) => `<span>${l}</span>`).join("");
    s.stats.forEach((v, i) => document.getElementById(`s${i + 1}`).textContent = v);
  }
  document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
    document.querySelectorAll(".tabs button").forEach((o) => o.setAttribute("aria-pressed", o === b));
    show(b.textContent);
  });
  show("7d");
</script>
</body>
</html>
