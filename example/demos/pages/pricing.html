<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pricing</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #faf7f2; color: #1c1917; }
  main { max-width: 1000px; margin: 0 auto; padding: 64px 32px; text-align: center; }
  h1 { font-size: 40px; margin: 0 0 10px; letter-spacing: -.02em; }
  .sub { color: #78716c; margin: 0 0 28px; }
  .toggle { display: inline-flex; background: #eee8df; border-radius: 99px; padding: 4px; margin-bottom: 36px; }
  .toggle button { font: inherit; border: 0; background: none; padding: 8px 18px; border-radius: 99px; color: #78716c; cursor: pointer; }
  .toggle button[aria-pressed=true] { background: #1c1917; color: #fff; }
  .toggle em { font-style: normal; font-size: 12px; color: #16a34a; margin-left: 6px; }
  .tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; text-align: left; }
  .tier { background: #fff; border: 1px solid #ebe5dc; border-radius: 18px; padding: 26px; }
  .tier.pro { border: 2px solid #ea580c; box-shadow: 0 18px 50px rgba(234,88,12,.12); }
  .tier h2 { margin: 0; font-size: 18px; }
  .price { font-size: 40px; font-weight: 700; margin: 14px 0 2px; letter-spacing: -.02em; }
  .price small { font-size: 15px; font-weight: 400; color: #78716c; }
  .was { color: #a8a29e; text-decoration: line-through; font-size: 14px; min-height: 21px; }
  ul { padding: 0; list-style: none; margin: 18px 0 22px; color: #57534e; }
  li { padding: 4px 0; } li::before { content: "✓  "; color: #16a34a; }
  .cta { width: 100%; font: 600 15px system-ui; padding: 12px; border-radius: 11px; border: 1px solid #1c1917; background: #fff; cursor: pointer; }
  .pro .cta { background: #ea580c; border-color: #ea580c; color: #fff; }
  .cta.on { background: #16a34a; border-color: #16a34a; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Pricing that scales with you</h1>
  <p class="sub">Every plan includes unlimited projects.</p>
  <div class="toggle">
    <button data-testid="monthly" aria-pressed="true">Monthly</button>
    <button data-testid="annual" aria-pressed="false">Annual<em>−20%</em></button>
  </div>
  <div class="tiers">
    <div class="tier"><h2>Starter</h2><div class="price" data-m="0" data-y="0">$0<small> / mo</small></div><div class="was"></div><ul><li>3 members</li><li>Community support</li></ul><button class="cta">Get started</button></div>
    <div class="tier pro"><h2>Pro</h2><div class="price" data-m="30" data-y="24">$30<small> / mo</small></div><div class="was"></div><ul><li>Unlimited members</li><li>Priority support</li><li>SSO</li></ul><button class="cta" data-testid="start-pro">Start free trial</button></div>
    <div class="tier"><h2>Business</h2><div class="price" data-m="80" data-y="64">$80<small> / mo</small></div><div class="was"></div><ul><li>Audit log</li><li>Dedicated manager</li></ul><button class="cta">Talk to sales</button></div>
  </div>
</main>
<script>
  const btns = document.querySelectorAll(".toggle button");
  btns.forEach((b) => b.onclick = () => {
    btns.forEach((o) => o.setAttribute("aria-pressed", o === b));
    const annual = b.dataset.testid === "annual";
    document.querySelectorAll(".price").forEach((p) => {
      const v = annual ? p.dataset.y : p.dataset.m;
      p.innerHTML = `$${v}<small> / mo</small>`;
      p.nextElementSibling.textContent = annual && p.dataset.m !== "0" ? `$${p.dataset.m}` : "";
    });
  });
  document.querySelector("[data-testid=start-pro]").onclick = (e) => {
    e.target.classList.add("on");
    e.target.textContent = "Trial started ✓";
  };
</script>
</body>
</html>
