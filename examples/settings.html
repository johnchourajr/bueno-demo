<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team settings</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: #f6f5f1; color: #1d1b16; }
  main { max-width: 560px; margin: 96px auto; padding: 40px; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.06); }
  h1 { margin: 0 0 24px; font-size: 28px; }
  label { display: block; font-size: 14px; color: #6b675e; margin-bottom: 6px; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border: 1px solid #d9d5ca; border-radius: 10px; }
  .row { display: flex; align-items: center; justify-content: space-between; margin: 28px 0; }
  .switch { width: 46px; height: 26px; border-radius: 13px; background: #d9d5ca; border: 0; position: relative; cursor: pointer; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch[aria-checked=true] { background: #fa763d; }
  .switch[aria-checked=true]::after { transform: translateX(20px); }
  button.save { font: inherit; padding: 10px 20px; border: 0; border-radius: 10px; background: #1d1b16; color: #fff; cursor: pointer; }
  .saved { margin-left: 12px; color: #2f8a4c; opacity: 0; transition: opacity .2s; }
  .saved.on { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>Team settings</h1>
  <label for="team">Team name</label>
  <input id="team" data-testid="team-name" value="Acme">
  <div class="row">
    <span>Email me weekly summaries</span>
    <button class="switch" role="switch" aria-checked="false" data-testid="summaries"
      onclick="this.setAttribute('aria-checked', this.getAttribute('aria-checked') !== 'true')"></button>
  </div>
  <button class="save" data-testid="save" onclick="document.querySelector('.saved').classList.add('on')">Save</button>
  <span class="saved">Saved</span>
</main>
</body>
</html>
